
services:
  - type: web
    name: documind
    runtime: docker
    plan: free
    rootDir: documind
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
